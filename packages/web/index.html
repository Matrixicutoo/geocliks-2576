<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link rel="icon" href="/favicon.ico" sizes="any" />
		<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
		<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
		<meta name="theme-color" content="#ffffff" />
		<meta
			name="description"
			content="GeoCliks — tamper-proof photo documentation for field teams. Network-verified time, GPS and address on every photo, synced to a shared Teamspace and exported as professional reports."
		/>
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="GeoCliks" />
		<meta property="og:locale" content="en_US" />
		<meta property="og:title" content="GeoCliks — Proof your work happened" />
		<meta
			property="og:description"
			content="Tamper-proof field photos with network-verified time, GPS coordinates and street address — synced to your crew's Teamspace and exported as closeout reports."
		/>
		<!-- Absolute, not "/og-image.png": most unfurlers do not resolve a relative og:image. -->
		<meta property="og:image" content="https://geocliks.com/og-image.png" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="GeoCliks — Proof your work happened" />
		<meta
			name="twitter:description"
			content="Tamper-proof field photos with network-verified time, GPS coordinates and street address — synced to your crew's Teamspace and exported as closeout reports."
		/>
		<meta name="twitter:image" content="https://geocliks.com/og-image.png" />
		<!-- Fonts are self-hosted from /fonts (see src/web/styles.css) — nothing is fetched from
		     Google, so no visitor IP leaves the site just to load type. These two subsets are what
		     every page paints with; the rest load on demand by unicode-range. -->
		<link rel="preload" href="/fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin />
		<link rel="preload" href="/fonts/sora-latin.woff2" as="font" type="font/woff2" crossorigin />
		<!-- Everything above is the sitewide default, and every public route replaces it at
		     runtime from src/web/lib/seo.ts. Deliberately no canonical and no og:url here: a
		     static one would have to say "https://geocliks.com/", and on the render of a help
		     article that points every page at the home page. Absent, a crawler treats the URL
		     it fetched as canonical, which is the right default, and the hook writes the real
		     one per route. -->
		<title>GeoCliks — Proof your work happened</title>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/web/main.tsx"></script>
	</body>
</html>
